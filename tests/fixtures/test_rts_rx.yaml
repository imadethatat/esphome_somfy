# ESPHome compile-test for somfy RTS cover with the full RX path enabled.
esphome:
  name: test-somfy-rx

esp32:
  board: esp32dev

# INFO, not the default DEBUG, so ESP_LOGD compiles away here. That is what the
# real devices build, and it is the only way this fixture sees the warnings the
# stripped-out log statements cause (e.g. -Wempty-body). test_rts_tx_only keeps
# the default level so both paths stay covered.
logger:
  level: INFO

external_components:
  - source:
      type: local
      path: ../../components

remote_transmitter:
  id: transmitter
  pin: GPIO4
  carrier_duty_percent: 100%

remote_receiver:
  id: receiver
  pin: GPIO5

somfy:
  - id: rts_hub
    type: rts
    remote_transmitter: transmitter
    remote_receiver: receiver

text_sensor:
  - platform: template
    id: detected
    name: "Detected Remote"

button:
  - platform: template
    id: prog_button
    name: "Prog Button"

cover:
  - platform: somfy
    type: rts
    name: "Test Cover RX"
    open_duration: 40s
    close_duration: 40s
    storage_key: TestKey
    remote_code: 0x123456
    prog_button: prog_button
    somfy_id: rts_hub
    detected_remote: detected
    allowed_remotes:
      - 0xABCDEF
      - 0x112233
